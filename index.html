<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div style="display:flex; align-items:center; gap:15px;">
            <button class="menu-toggle" onclick="toggleCategories()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="logo">متجري</div>
        </div>
        <div>
            <a href="cart.html" id="cartCount" style="margin-left:15px; color:#333; text-decoration:none;"> السلة (0)</a>
            <span id="userMenu"></span>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleCategories()"></div>
    <div class="sidebar" id="categoriesSidebar">
        <div class="sidebar-header">
            <h3>التصنيفات</h3>
            <button class="close-btn" onclick="toggleCategories()">✕</button>
        </div>
        <div class="sidebar-content" id="sidebarCategories">
            <div class="category-item active" data-category="all" onclick="filterCategory('all')">الكل</div>
        </div>
    </div>

    <div class="container">
        <div class="banner-container" id="bannersContainer"></div>
        <h2 class="section-title">المنتجات</h2>
        <div class="products-grid" id="products-container">
            <p style="padding: 20px; grid-column: 1/-1;">جاري تحميل المنتجات...</p>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
