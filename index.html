<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">متجري</div>
        <div>
            <a href="cart.html" id="cartCount" style="margin-left:15px; color:#333; text-decoration:none;">🛒 السلة (0)</a>
            <span id="userMenu"></span>
        </div>
    </header>
    <div class="container">
        <div style="background: linear-gradient(135deg, #e63946, #f77f00); height: 200px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: white;">
            <h2>🔥 عروض حصرية على جميع المنتجات</h2>
        </div>

        <h2 class="section-title">التصنيفات</h2>
        <div class="categories-grid" id="categoriesContainer">
            <div class="category-item active" data-category="all">الكل</div>
        </div>

        <h2 class="section-title">المنتجات</h2>
        <div class="scrolling-wrapper" id="products-container" style="flex-wrap: wrap; overflow-x: visible;">
            <p style="padding: 20px;">جاري تحميل المنتجات...</p>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
