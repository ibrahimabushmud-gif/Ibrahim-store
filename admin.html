<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>لوحة التحكم</h1>
    <p id="status">جاري التحميل...</p>
    
    <div id="content" style="display:none;">
        <h2>الأقسام</h2>
        <form id="catForm">
            <input type="text" id="catName" placeholder="اسم القسم" required>
            <button type="submit">إضافة قسم</button>
        </form>
        <div id="catList"></div>
        
        <h2>المنتجات</h2>
        <form id="prodForm">
            <input type="text" id="prodName" placeholder="اسم المنتج" required><br>
            <input type="url" id="prodImage" placeholder="رابط الصورة" required><br>
            <select id="prodCategory" required><option value="">اختر القسم</option></select><br>
            <input type="number" id="prodPrice" placeholder="السعر" required><br>
            <button type="submit">إضافة منتج</button>
        </form>
        <div id="prodList"></div>
    </div>
    
    <script type="module" src="admin.js"></script>
</body>
</html>
