<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الدفع</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .payment-page { max-width: 600px; margin: 20px auto; padding: 20px; }
        .payment-card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .payment-methods-logos { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .card-form { margin-top: 20px; }
        .card-form .form-row { margin-bottom: 20px; }
        .card-form label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--primary-color); }
        .card-form input { width: 100%; padding: 15px; border: 2px solid #E1BEE7; border-radius: 10px; font-family: 'Tajawal'; font-size: 16px; }
        .card-form input:focus { outline: none; border-color: var(--primary-color); }
        .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-pay { background: var(--primary-color); color: white; border: none; padding: 18px; width: 100%; border-radius: 25px; font-size: 18px; font-weight: 700; cursor: pointer; font-family: 'Tajawal'; margin-top: 20px; transition: 0.3s; }
        .btn-pay:hover { background: var(--primary-dark); }
        .btn-pay:disabled { background: #ccc; cursor: not-allowed; }
        .order-summary { background: var(--accent-color); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .order-summary h3 { color: var(--primary-color); margin-bottom: 15px; }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid white; }
        .summary-row:last-child { border-bottom: none; font-weight: 800; font-size: 18px; color: var(--primary-color); }
        
        /* OTP Modal */
        .otp-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .otp-modal.show { display: flex; }
        .otp-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .otp-box h3 { color: var(--primary-color); margin-bottom: 15px; }
        .otp-box p { margin-bottom: 20px; color: #666; }
        .otp-inputs { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        .otp-inputs input {
            width: 50px; height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #E1BEE7;
            border-radius: 10px;
        }
        .otp-inputs input:focus { outline: none; border-color: var(--primary-color); }
        .btn-verify { background: var(--primary-color); color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: 'Tajawal'; margin: 5px; }
        .btn-resend { background: white; color: var(--primary-color); border: 2px solid var(--primary-color); padding: 12px 30px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: 'Tajawal'; margin: 5px; }
        .success-message { color: var(--success-color); font-weight: bold; margin-top: 15px; }
        .error-message { color: var(--danger-color); font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <header>
        <div style="display:flex; align-items:center; gap:15px;">
            <a href="cart.html" style="color:var(--primary-color); font-size:24px; text-decoration:none;">→</a>
            <div class="logo"><div class="logo-icon">🛍️</div><span>متجري</span></div>
        </div>
    </header>

    <div class="payment-page">
        <div class="order-summary" id="orderSummary"></div>

        <div class="payment-card">
            <div class="payment-methods-logos" style="display:flex; justify-content:center; gap:15px; margin:20px 0; flex-wrap:wrap;">
    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/Mada_Logo.svg/960px-Mada_Logo.svg.png" alt="mada" style="height:40px; object-fit:contain;">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a4/Mastercard_2019_logo.svg" alt="mastercard" style="height:40px; object-fit:contain;">
    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Visa_Inc._logo_%282021%E2%80%93present%29.svg/3840px-Visa_Inc._logo_%282021%E2%80%93present%29.svg.png" alt="visa" style="height:40px; object-fit:contain;">
    <img src="https://play-lh.googleusercontent.com/ACMZTrTS8bgAfKOnL7eZ1Sb9M-TNbT5ADOxiBvYeY4Lsd3dBxidz18RuicQ5OZoBoU5uV9DVzi-1xyon9wBm=s0-br30" alt="amex" style="height:40px; object-fit:contain;">
</div>

            <h3 style="color:var(--primary-color); margin:20px 0;">💳 بيانات البطاقة</h3>
            
            <div class="card-form">
                <div class="form-row">
                    <label>رقم البطاقة *</label>
                    <input type="text" id="cardNumber" placeholder="**** **** **** ****" maxlength="19">
                </div>
                <div class="card-row">
                    <div class="form-row">
                        <label>تاريخ البطاقة *</label>
                        <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="form-row">
                        <label>رمز CVV *</label>
                        <input type="text" id="cardCVV" placeholder="CVV" maxlength="4">
                    </div>
                </div>
                <div class="form-row">
                    <label>اسم حامل البطاقة *</label>
                    <input type="text" id="cardName" placeholder="اسم حامل البطاقة">
                </div>

                <button class="btn-pay" id="payBtn" onclick="processPayment()">ادفع الآن 🔒</button>
            </div>
        </div>
    </div>

    <!-- OTP Modal -->
    <div class="otp-modal" id="otpModal">
        <div class="otp-box">
            <h3>🔐 رمز التحقق</h3>
            <p>تم إرسال رمز التحقق إلى واتساب: <br><strong id="otpPhone"></strong></p>
            <p style="font-size:14px; color:#999;">أدخل الرمز المكون من 6 أرقام</p>
            
            <div class="otp-inputs">
                <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 0)">
                <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 1)">
                <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 2)">
                <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 3)">
                <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 4)">
                <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 5)">
            </div>
            
            <div>
                <button class="btn-verify" onclick="verifyOTP()">تحقق من الرمز ✓</button>
                <button class="btn-resend" onclick="resendOTP()">إعادة إرسال 🔄</button>
            </div>
            
            <div id="otpMessage"></div>
        </div>
    </div>

    <a href="https://wa.me/972592152484" class="whatsapp-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <script type="module" src="payment.js"></script>
</body>
</html>
